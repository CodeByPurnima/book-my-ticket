<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChaiCode Cinema - Book Your Seat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap");
        body {
            font-family: "Outfit", sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">

    <!-- Auth Container -->
    <div id="authContainer" class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-md">
            <!-- Login Form -->
            <div id="loginForm" class="bg-slate-800/80 backdrop-blur-xl rounded-3xl shadow-2xl p-10 border border-slate-700/50">
                <h1 class="text-3xl font-bold text-blue-600 mb-2 text-center">
                    ChaiCode Cinema
                </h1>
                <p class="text-slate-400 text-center mb-8">Book Your Perfect Seat</p>

                <form id="loginFormElement" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Email</label>
                        <input type="email" id="loginEmail" placeholder="your@email.com" 
                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Password</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" 
                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500" required>
                    </div>
                    <button type="submit" 
                        class="w-full py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition-all duration-300">
                        Login
                    </button>
                </form>

                <p class="text-center text-slate-400 mt-6">
                    Don't have an account? 
                    <button id="toggleRegisterBtn" class="text-blue-600 hover:text-blue-700 font-semibold">Register</button>
                </p>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="hidden bg-slate-800/80 backdrop-blur-xl rounded-3xl shadow-2xl p-10 border border-slate-700/50">
                <h1 class="text-3xl font-bold text-blue-600 mb-2 text-center">
                    Create Account
                </h1>
                <p class="text-slate-400 text-center mb-8">Join us for amazing movies!</p>

                <form id="registerFormElement" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Full Name</label>
                        <input type="text" id="registerName" placeholder="John Doe" 
                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Email</label>
                        <input type="email" id="registerEmail" placeholder="your@email.com" 
                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Password</label>
                        <input type="password" id="registerPassword" placeholder="••••••••" 
                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500" required>
                    </div>
                    <button type="submit" 
                        class="w-full py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition-all duration-300">
                        Register
                    </button>
                </form>

                <p class="text-center text-slate-400 mt-6">
                    Already have an account? 
                    <button id="toggleLoginBtn" class="text-blue-600 hover:text-blue-700 font-semibold">Login</button>
                </p>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="appContainer" class="hidden min-h-screen p-6">
        <!-- Header -->
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-center mb-10">
                <div>
                    <h1 class="text-4xl font-bold text-blue-600">
                        ChaiCode Cinema
                    </h1>
                    <p class="text-slate-400 mt-2">Dhurandhar The Revenge - Now Showing</p>
                </div>
                <div class="text-right">
                    <p class="text-slate-300 mb-2">Welcome, <span id="userName" class="font-bold text-blue-600"></span></p>
                    <button id="logoutBtn" class="px-6 py-2 bg-red-500/20 text-red-400 border border-red-500/50 rounded-lg hover:bg-red-500/30 transition-all">
                        Logout
                    </button>
                </div>
            </div>

            <!-- Legend -->
            <div class="flex justify-center mb-10">
                <div class="bg-slate-900/50 rounded-full px-6 py-3 border border-slate-700 flex gap-8 items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-4 h-4 rounded-full bg-blue-600"></div>
                        <span class="text-slate-300 font-medium">Available</span>
                    </div>
                    <div class="w-px h-6 bg-slate-700"></div>
                    <div class="flex items-center gap-3">
                        <div class="w-4 h-4 rounded-full bg-rose-500/20 border border-rose-500/50"></div>
                        <span class="text-slate-400 font-medium">Booked</span>
                    </div>
                </div>
            </div>

            <!-- Seats Grid -->
            <div class="flex justify-center">
                <div class="bg-slate-900/40 p-8 rounded-2xl border border-slate-700/50 shadow-inner">
                    <table id="tbl" class="border-separate border-spacing-4 mx-auto"></table>
                </div>
            </div>
        </div>
    </div>

    <script>
        
        const API_URL =  'https://book-my-ticket-two.vercel.app/api' || 'http://localhost:8080/api';

        // DOM Elements
        const authContainer = document.getElementById('authContainer');
        const appContainer = document.getElementById('appContainer');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const toggleRegisterBtn = document.getElementById('toggleRegisterBtn');
        const toggleLoginBtn = document.getElementById('toggleLoginBtn');
        const loginFormElement = document.getElementById('loginFormElement');
        const registerFormElement = document.getElementById('registerFormElement');
        const logoutBtn = document.getElementById('logoutBtn');
        const userName = document.getElementById('userName');

        // Toggle between login and register
        toggleRegisterBtn.addEventListener('click', () => {
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
        });

        toggleLoginBtn.addEventListener('click', () => {
            registerForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
        });

        // Register
        registerFormElement.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            try {
                const res = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();
                if (data.success) {
                    alert('Registration successful! Please login.');
                    registerForm.classList.add('hidden');
                    loginForm.classList.remove('hidden');
                    registerFormElement.reset();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (err) {
                alert('Registration failed: ' + err.message);
            }
        });

        // Login
        loginFormElement.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (data.success) {
                    // Store token
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('userName', data.data.name);
                    
                    // Show app
                    authContainer.classList.add('hidden');
                    appContainer.classList.remove('hidden');
                    userName.textContent = data.data.name;
                    
                    // Load seats
                    loadSeats();
                    loginFormElement.reset();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (err) {
                alert('Login failed: ' + err.message);
            }
        });

        // Logout
        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('userName');
            authContainer.classList.remove('hidden');
            appContainer.classList.add('hidden');
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
        });

        // Load seats
        async function loadSeats() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`${API_URL}/seats`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const seats = await res.json();
                const tbl = document.getElementById('tbl');
                tbl.innerHTML = '';

                const sortedSeats = seats.sort((a, b) => a.id - b.id);
                let tr;

                for (let i = 0; i < sortedSeats.length; i++) {
                    if (i % 8 === 0) tr = document.createElement('tr');

                    const td = document.createElement('td');
                    const baseClasses = 'w-32 h-32 rounded-2xl text-center align-middle text-2xl font-bold transition-all duration-300 select-none relative group';

                    if (sortedSeats[i].isbooked) {
                        td.className = `${baseClasses} bg-gray-300 text-gray-600 border border-gray-400 cursor-not-allowed`;
                        td.innerHTML = `
                            <span class="relative z-10">${sortedSeats[i].id}</span>
                            <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-3 px-4 py-2 bg-white border border-gray-300 text-sm text-gray-800 rounded-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 whitespace-nowrap shadow-lg z-50 pointer-events-none font-normal">
                                Booked by: <span class="font-bold">${sortedSeats[i].name}</span>
                            </div>
                        `;
                    } else {
                        td.className = `${baseClasses} bg-blue-600 text-white border-2 border-blue-500 cursor-pointer hover:bg-blue-700 hover:-translate-y-1.5 active:scale-95`;
                        td.innerHTML = `<span class="relative z-10">${sortedSeats[i].id}</span>`;

                        td.addEventListener('click', async () => {
                            const seatId = sortedSeats[i].id;
                            const userNameForBooking = localStorage.getItem('userName');

                            try {
                                const res = await fetch(`${API_URL}/${seatId}/${userNameForBooking}`, { method: 'PUT', headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` } });
                                const data = await res.json();

                                if (data.success) {
                                    alert('Seat booked successfully!');
                                    loadSeats();
                                } else {
                                    alert('Error: ' + data.message);
                                }
                            } catch (err) {
                                alert('Booking failed: ' + err.message);
                            }
                        });
                    }

                    tr.appendChild(td);
                    tbl.appendChild(tr);
                }
            } catch (err) {
                alert('Failed to load seats: ' + err.message);
            }
        }

        // Check if user is logged in on page load
        window.addEventListener('load', () => {
            const token = localStorage.getItem('token');
            if (token) {
                authContainer.classList.add('hidden');
                appContainer.classList.remove('hidden');
                userName.textContent = localStorage.getItem('userName');
                loadSeats();
            }
        });
    </script>
  </body>
</html>
